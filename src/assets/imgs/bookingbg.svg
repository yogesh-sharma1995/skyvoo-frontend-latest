<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Smooth linear fade mask at the bottom so it never cuts or tears -->
    <mask id="smoothFade">
      <rect width="1920" height="1080" fill="url(#maskGradient)" />
    </mask>
    <linearGradient id="maskGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="95%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Perfectly smooth mathematical 3D sphere gradient -->
    <radialGradient id="sphere3D" cx="72%" cy="48%" r="58%" fx="52%" fy="26%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#ececf0" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#d4d4dc" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#b6b6bf" stop-opacity="0.65" />
      <stop offset="92%" stop-color="#9d9da8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#888894" stop-opacity="0.45" />
    </radialGradient>

    <!-- Soft ambient diffusion edge -->
    <radialGradient id="ambientGlow" cx="78%" cy="58%" r="65%">
      <stop offset="0%" stop-color="#e0e0e6" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#f2f2f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Pure White Base Background -->
  <rect width="1920" height="1080" fill="#ffffff" />

  <g mask="url(#smoothFade)">
    <!-- Soft outer glow -->
    <ellipse cx="1650" cy="720" rx="1050" ry="850" fill="url(#ambientGlow)" />
    <!-- Main 3D Sphere Dome Arc -->
    <circle cx="1680" cy="700" r="920" fill="url(#sphere3D)" />
  </g>
</svg>
